name: Auto Generate and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Full Android Project v2.0
        run: |
          mkdir -p app/src/main/java/com/drblack/budscontroller
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BudsController"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '7.4.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.drblack.budscontroller'
              compileSdk 34
              defaultConfig {
                  applicationId "com.drblack.budscontroller"
                  minSdk 31
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:label="Buds Controller Pro"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver android:name=".BudsWidgetProvider" android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="android.bluetooth.device.action.ACL_CONNECTED" />
                          <action android:name="android.bluetooth.device.action.ACL_DISCONNECTED" />
                          <action android:name="android.bluetooth.device.action.BATTERY_LEVEL_CHANGED" />
                          <action android:name="com.drblack.budscontroller.ACTION_MODE_ANC" />
                          <action android:name="com.drblack.budscontroller.ACTION_MODE_TRANS" />
                          <action android:name="com.drblack.budscontroller.ACTION_MODE_OFF" />
                          <action android:name="com.drblack.budscontroller.ACTION_VOL_UP" />
                          <action android:name="com.drblack.budscontroller.ACTION_VOL_DOWN" />
                          <action android:name="com.drblack.budscontroller.ACTION_PLAY_PAUSE" />
                          <action android:name="com.drblack.budscontroller.ACTION_EQ" />
                          <action android:name="com.drblack.budscontroller.ACTION_OPEN_CODEC" />
                          <action android:name="com.drblack.budscontroller.ACTION_CONNECT_PANEL" />
                          <action android:name="com.drblack.budscontroller.ACTION_REFRESH" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="280dp"
              android:minHeight="150dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_buds"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/widget_buds.xml
