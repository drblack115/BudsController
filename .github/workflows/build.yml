          cat << 'EOF' > app/src/main/java/com/drblack/budscontroller/BudsWidgetProvider.kt
          package com.drblack.budscontroller

          import android.annotation.SuppressLint
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.bluetooth.*
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.media.AudioManager
          import android.media.audiofx.AudioEffect
          import android.provider.Settings
          import android.view.KeyEvent
          import android.widget.RemoteViews
          import java.util.UUID

          @SuppressLint("MissingPermission")
          class BudsWidgetProvider : AppWidgetProvider() {

              companion object {
                  const val ACTION_ANC = "com.drblack.budscontroller.ACTION_MODE_ANC"
                  const val ACTION_TRANS = "com.drblack.budscontroller.ACTION_MODE_TRANS"
                  const val ACTION_OFF = "com.drblack.budscontroller.ACTION_MODE_OFF"
                  const val ACTION_VOL_UP = "com.drblack.budscontroller.ACTION_VOL_UP"
                  const val ACTION_VOL_DOWN = "com.drblack.budscontroller.ACTION_VOL_DOWN"
                  const val ACTION_PLAY_PAUSE = "com.drblack.budscontroller.ACTION_PLAY_PAUSE"
                  const val ACTION_EQ = "com.drblack.budscontroller.ACTION_EQ"
                  const val ACTION_CODEC = "com.drblack.budscontroller.ACTION_OPEN_CODEC"
                  const val ACTION_CONNECT_PANEL = "com.drblack.budscontroller.ACTION_CONNECT_PANEL"
                  const val ACTION_REFRESH = "com.drblack.budscontroller.ACTION_REFRESH"

                  fun updateAllWidgets(context: Context) {
                      val manager = AppWidgetManager.getInstance(context)
                      val ids = manager.getAppWidgetIds(ComponentName(context, BudsWidgetProvider::class.java))
                      val intent = Intent(context, BudsWidgetProvider::class.java).apply {
                          action = AppWidgetManager.ACTION_APPWIDGET_UPDATE
                          putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, ids)
                      }
                      context.sendBroadcast(intent)
                  }

                  fun dispatchDeviceCommand(context: Context, hexPayload: String) {
                      val prefs = context.getSharedPreferences("BudsPrefs", Context.MODE_PRIVATE)
                      val mac = prefs.getString("DEVICE_MAC", "00:BB:43:31:46:A8") ?: "00:BB:43:31:46:A8"
                      val serviceUuidStr = prefs.getString("SERVICE_UUID", "") ?: ""
                      val charUuidStr = prefs.getString("CHAR_UUID", "") ?: ""

                      if (mac.isEmpty() || serviceUuidStr.isEmpty()) return

                      val btManager = context.getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                      val device = try { btManager.adapter?.getRemoteDevice(mac) } catch (_: Exception) { null } ?: return
                      val payloadBytes = hexStringToByteArray(hexPayload)

                      // إذا كانت القناة RFCOMM Classic بدون Characteristic UUID
                      if (charUuidStr.isEmpty() || charUuidStr == "RFCOMM") {
                          Thread {
                              try {
                                  val socket = device.createInsecureRfcommSocketToServiceRecord(UUID.fromString(serviceUuidStr))
                                  socket.connect()
                                  socket.outputStream.write(payloadBytes)
                                  socket.outputStream.flush()
                                  Thread.sleep(150)
                                  socket.close()
                              } catch (_: Exception) {}
                          }.start()
                          return
                      }

                      // إرسال عبر BLE GATT
                      device.connectGatt(context, false, object : BluetoothGattCallback() {
                          override fun onConnectionStateChange(gatt: BluetoothGatt, status: Int, newState: Int) {
                              if (newState == BluetoothProfile.STATE_CONNECTED) {
                                  gatt.discoverServices()
                              }
                          }
                          override fun onServicesDiscovered(gatt: BluetoothGatt, status: Int) {
                              try {
                                  val service = gatt.getService(UUID.fromString(serviceUuidStr))
                                  val characteristic = service?.getCharacteristic(UUID.fromString(charUuidStr))
                                  if (characteristic != null) {
                                      characteristic.value = payloadBytes
                                      gatt.writeCharacteristic(characteristic)
                                  }
                              } catch (_: Exception) {
                              } finally {
                                  gatt.disconnect()
                                  gatt.close()
                              }
                          }
                      }, BluetoothDevice.TRANSPORT_LE)
                  }

                  fun hexStringToByteArray(s: String): ByteArray {
                      val clean = s.replace(" ", "").trim()
                      if (clean.length % 2 != 0) return ByteArray(0)
                      val len = clean.length
                      val data = ByteArray(len / 2)
                      var i = 0
                      while (i < len) {
                          val d1 = Character.digit(clean[i], 16)
                          val d2 = Character.digit(clean[i + 1], 16)
                          if (d1 != -1 && d2 != -1) {
                              data[i / 2] = ((d1 shl 4) + d2).toByte()
                          }
                          i += 2
                      }
                      return data
                  }
              }

              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (widgetId in appWidgetIds) {
                      updateWidgetUI(context, appWidgetManager, widgetId)
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  val prefs = context.getSharedPreferences("BudsPrefs", Context.MODE_PRIVATE)
                  val audioManager = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager

                  when (intent.action) {
                      ACTION_ANC -> {
                          prefs.edit().putString("CURRENT_MODE", "ANC").apply()
                          dispatchDeviceCommand(context, prefs.getString("HEX_ANC", "0101") ?: "0101")
                      }
                      ACTION_TRANS -> {
                          prefs.edit().putString("CURRENT_MODE", "TRANS").apply()
                          dispatchDeviceCommand(context, prefs.getString("HEX_TRANS", "0102") ?: "0102")
                      }
                      ACTION_OFF -> {
                          prefs.edit().putString("CURRENT_MODE", "OFF").apply()
                          dispatchDeviceCommand(context, prefs.getString("HEX_OFF", "0100") ?: "0100")
                      }
                      ACTION_VOL_UP -> {
                          audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                      }
                      ACTION_VOL_DOWN -> {
                          audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                      }
                      ACTION_PLAY_PAUSE -> {
                          audioManager.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE))
                          audioManager.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE))
                      }
                      ACTION_EQ -> {
                          try {
                              val eqIntent = Intent(AudioEffect.ACTION_DISPLAY_AUDIO_EFFECT_CONTROL_PANEL).apply {
                                  flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              }
                              context.startActivity(eqIntent)
                          } catch (_: Exception) {
                              val soundIntent = Intent(Settings.ACTION_SOUND_SETTINGS).apply {
                                  flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              }
                              context.startActivity(soundIntent)
                          }
                      }
                      ACTION_CODEC -> {
                          try {
                              val devIntent = Intent(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS).apply {
                                  flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              }
                              context.startActivity(devIntent)
                          } catch (_: Exception) {
                              val btIntent = Intent(Settings.ACTION_BLUETOOTH_SETTINGS).apply {
                                  flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              }
                              context.startActivity(btIntent)
                          }
                      }
                      ACTION_CONNECT_PANEL -> {
                          try {
                              val panelIntent = Intent("android.settings.panel.action.BLUETOOTH").apply {
                                  flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              }
                              context.startActivity(panelIntent)
                          } catch (_: Exception) {
                              val btIntent = Intent(Settings.ACTION_BLUETOOTH_SETTINGS).apply {
                                  flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              }
                              context.startActivity(btIntent)
                          }
                      }
                  }
                  updateAllWidgets(context)
              }

              private fun updateWidgetUI(context: Context, appWidgetManager: AppWidgetManager, widgetId: Int) {
                  val prefs = context.getSharedPreferences("BudsPrefs", Context.MODE_PRIVATE)
                  val savedMac = prefs.getString("DEVICE_MAC", "00:BB:43:31:46:A8") ?: "00:BB:43:31:46:A8"
                  val currentMode = prefs.getString("CURRENT_MODE", "OFF") ?: "OFF"

                  val views = RemoteViews(context.packageName, R.layout.widget_buds)
                  val btManager = context.getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  val adapter = btManager.adapter
                  val device = try { if (savedMac.isNotEmpty() && adapter != null) adapter.getRemoteDevice(savedMac) else null } catch (_: Exception) { null }

                  val audioManager = context.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val curVol = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)
                  val maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC).coerceAtLeast(1)
                  val volPct = (curVol * 100) / maxVol

                  if (device != null) {
                      views.setTextViewText(R.id.tv_device_name, device.name ?: "moto buds")
                      val battery = getDeviceBatteryLevel(device)
                      if (battery in 0..100) {
                          views.setTextViewText(R.id.tv_battery, "🔋 $battery%")
                          views.setTextViewText(R.id.tv_status, "متصل • الوضع: $currentMode • الصوت: $volPct%")
                      } else {
                          views.setTextViewText(R.id.tv_battery, "غير متصل")
                          views.setTextViewText(R.id.tv_status, "الصوت: $volPct% • اضغط على الاسم للإعدادات")
                      }
                  } else {
                      views.setTextViewText(R.id.tv_device_name, "moto buds")
                      views.setTextViewText(R.id.tv_status, "اضغط هنا لفتح لوحة التحكم الشاملة")
                  }

                  val activeColor = ColorStateList.valueOf(Color.parseColor("#1976D2"))
                  val idleColor = ColorStateList.valueOf(Color.parseColor("#2C2C2C"))
                  views.setColorStateList(R.id.btn_anc, "setBackgroundTintList", if (currentMode == "ANC") activeColor else idleColor)
                  views.setColorStateList(R.id.btn_trans, "setBackgroundTintList", if (currentMode == "TRANS") activeColor else idleColor)
                  views.setColorStateList(R.id.btn_off, "setBackgroundTintList", if (currentMode == "OFF") activeColor else idleColor)

                  views.setOnClickPendingIntent(R.id.btn_anc, getPendingIntent(context, ACTION_ANC))
                  views.setOnClickPendingIntent(R.id.btn_trans, getPendingIntent(context, ACTION_TRANS))
                  views.setOnClickPendingIntent(R.id.btn_off, getPendingIntent(context, ACTION_OFF))
                  views.setOnClickPendingIntent(R.id.btn_vol_up, getPendingIntent(context, ACTION_VOL_UP))
                  views.setOnClickPendingIntent(R.id.btn_vol_down, getPendingIntent(context, ACTION_VOL_DOWN))
                  views.setOnClickPendingIntent(R.id.btn_play_pause, getPendingIntent(context, ACTION_PLAY_PAUSE))
                  views.setOnClickPendingIntent(R.id.btn_eq, getPendingIntent(context, ACTION_EQ))
                  views.setOnClickPendingIntent(R.id.btn_codec, getPendingIntent(context, ACTION_CODEC))
                  views.setOnClickPendingIntent(R.id.btn_connect, getPendingIntent(context, ACTION_CONNECT_PANEL))
                  views.setOnClickPendingIntent(R.id.tv_battery, getPendingIntent(context, ACTION_REFRESH))

                  val openAppIntent = Intent(context, MainActivity::class.java)
                  val openAppPending = PendingIntent.getActivity(context, 0, openAppIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  views.setOnClickPendingIntent(R.id.tv_device_name, openAppPending)

                  appWidgetManager.updateAppWidget(widgetId, views)
              }

              private fun getPendingIntent(context: Context, actionStr: String): PendingIntent {
                  val intent = Intent(context, BudsWidgetProvider::class.java).apply { action = actionStr }
                  return PendingIntent.getBroadcast(context, actionStr.hashCode(), intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              }

              private fun getDeviceBatteryLevel(device: BluetoothDevice): Int {
                  return try {
                      val method = device.javaClass.getMethod("getBatteryLevel")
                      method.invoke(device) as Int
                  } catch (e: Exception) {
                      -1
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/drblack/budscontroller/MainActivity.kt
          package com.drblack.budscontroller

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.bluetooth.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.media.audiofx.AudioEffect
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.*

          @SuppressLint("MissingPermission")
          class MainActivity : Activity() {

              private var toneGen: ToneGenerator? = null
              private var isRinging = false

              data class DiscoveredChannel(val label: String, val serviceUuid: String, val charUuid: String)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      if (checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.BLUETOOTH_CONNECT, Manifest.permission.BLUETOOTH_SCAN), 101)
                      }
                  }

                  val prefs = getSharedPreferences("BudsPrefs", Context.MODE_PRIVATE)
                  val root = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#121212")) }
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(36, 48, 36, 60)
                  }

                  val title = TextView(this).apply {
                      text = "لوحة التحكم الشاملة - Moto Buds"
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, 20)
                  }
                  layout.addView(title)

                  // 1. اختيار السماعة
                  val spinner = Spinner(this)
                  val btManager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                  val pairedDevices = btManager.adapter?.bondedDevices?.toList() ?: emptyList()
                  val deviceNames = pairedDevices.map { "${it.name} (${it.address})" }
                  spinner.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, deviceNames)

                  val savedMac = prefs.getString("DEVICE_MAC", "00:BB:43:31:46:A8") ?: "00:BB:43:31:46:A8"
                  val defaultIndex = pairedDevices.indexOfFirst { it.address.equals(savedMac, ignoreCase = true) || (it.name ?: "").contains("moto", ignoreCase = true) }
                  if (defaultIndex >= 0) spinner.setSelection(defaultIndex)
                  layout.addView(spinner)

                  // 2. أزرار التحكم السريع في النظام والصوت
                  val quickRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 20, 0, 10)
                  }
                  val btnBtPanel = Button(this).apply {
                      text = "🔗 اتصال/فصل"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          try {
                              startActivity(Intent("android.settings.panel.action.BLUETOOTH"))
                          } catch (_: Exception) {
                              startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS))
                          }
                      }
                  }
                  val btnEq = Button(this).apply {
                      text = "🎚️ المعادل/Dolby"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          try {
                              startActivityForResult(Intent(AudioEffect.ACTION_DISPLAY_AUDIO_EFFECT_CONTROL_PANEL), 0)
                          } catch (_: Exception) {
                              startActivity(Intent(Settings.ACTION_SOUND_SETTINGS))
                          }
                      }
                  }
                  val btnFind = Button(this).apply {
                      text = "🔊 رنين البحث"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          if (!isRinging) {
                              val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                              am.setStreamVolume(AudioManager.STREAM_MUSIC, am.getStreamMaxVolume(AudioManager.STREAM_MUSIC), 0)
                              toneGen = ToneGenerator(AudioManager.STREAM_MUSIC, 100)
                              toneGen?.startTone(ToneGenerator.TONE_CDMA_EMERGENCY_RINGBACK, 10000)
                              isRinging = true
                              text = "⏹️ إيقاف الرنين"
                          } else {
                              toneGen?.stopTone()
                              toneGen?.release()
                              toneGen = null
                              isRinging = false
                              text = "🔊 رنين البحث"
                          }
                      }
                  }
                  quickRow.addView(btnBtPanel)
                  quickRow.addView(btnEq)
                  quickRow.addView(btnFind)
                  layout.addView(quickRow)

                  // 3. الماسح الذكي لاستخراج أكواد السماعة تلقائياً
                  val tvScanStatus = TextView(this).apply {
                      text = "اضغط على زر الفحص لاستخراج قنوات التحكم الخاصة بسماعتك:"
                      setTextColor(Color.parseColor("#00E676"))
                      textSize = 13f
                      setPadding(0, 20, 0, 10)
                  }
                  layout.addView(tvScanStatus)

                  val discoveredList = mutableListOf<DiscoveredChannel>()
                  val spDiscovered = Spinner(this)
                  layout.addView(spDiscovered)

                  val etService = createInput("Service UUID", prefs.getString("SERVICE_UUID", "") ?: "")
                  val etChar = createInput("Characteristic UUID (أو RFCOMM)", prefs.getString("CHAR_UUID", "") ?: "")
                  val etAnc = createInput("كود Hex لوضع العزل (ANC)", prefs.getString("HEX_ANC", "0101") ?: "0101")
                  val etTrans = createInput("كود Hex لوضع الشفافية", prefs.getString("HEX_TRANS", "0102") ?: "0102")
                  val etOff = createInput("كود Hex للوضع العادي (Off)", prefs.getString("HEX_OFF", "0100") ?: "0100")

                  spDiscovered.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          if (position in discoveredList.indices) {
                              val ch = discoveredList[position]
                              etService.setText(ch.serviceUuid)
                              etChar.setText(ch.charUuid)
                          }
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  val btnScan = Button(this).apply {
                      text = "🔍 فحص السماعة واستخراج الأكواد تلقائياً (Auto-Discover)"
                      setBackgroundColor(Color.parseColor("#2E7D32"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          val idx = spinner.selectedItemPosition
                          if (idx < 0 || idx >= pairedDevices.size) {
                              Toast.makeText(this@MainActivity, "اختر السماعة أولاً", Toast.LENGTH_SHORT).show()
                              return@setOnClickListener
                          }
                          val dev = pairedDevices[idx]
                          discoveredList.clear()
                          tvScanStatus.text = "جاري فحص قنوات ${dev.name} (BLE + RFCOMM)..."

                          // إضافة قنوات Classic Bluetooth SPP المكتشفة في النظام
                          dev.fetchUuidsWithSdp()
                          dev.uuids?.forEach { parcelUuid ->
                              val u = parcelUuid.uuid.toString()
                              // استبعاد بروتوكولات الصوت القياسية للتركيز على قنوات التحكم
                              if (!u.startsWith("0000110b") && !u.startsWith("0000110e") && !u.startsWith("0000111e") && !u.startsWith("00001200")) {
                                  discoveredList.add(DiscoveredChannel("Classic SPP: ${u.substring(0, 8)}...", u, "RFCOMM"))
                              }
                          }

                          // فحص قنوات BLE GATT القابلة للكتابة
                          dev.connectGatt(this@MainActivity, false, object : BluetoothGattCallback() {
                              override fun onConnectionStateChange(gatt: BluetoothGatt, status: Int, newState: Int) {
                                  if (newState == BluetoothProfile.STATE_CONNECTED) {
                                      gatt.discoverServices()
                                  } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                                      runOnUiThread {
                                          updateDiscoveredSpinner(spDiscovered, discoveredList, tvScanStatus)
                                      }
                                  }
                              }
                              override fun onServicesDiscovered(gatt: BluetoothGatt, status: Int) {
                                  for (service in gatt.services) {
                                      val sUuid = service.uuid.toString()
                                      for (ch in service.characteristics) {
                                          val props = ch.properties
                                          if ((props and (BluetoothGattCharacteristic.PROPERTY_WRITE or BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE)) != 0) {
                                              val cUuid = ch.uuid.toString()
                                              discoveredList.add(DiscoveredChannel("BLE Write: ${cUuid.substring(0, 8)}...", sUuid, cUuid))
                                          }
                                      }
                                  }
                                  gatt.disconnect()
                                  gatt.close()
                                  runOnUiThread {
                                      updateDiscoveredSpinner(spDiscovered, discoveredList, tvScanStatus)
                                  }
                              }
                          }, BluetoothDevice.TRANSPORT_LE)
                      }
                  }
                  layout.addView(btnScan)

                  layout.addView(etService)
                  layout.addView(etChar)
                  layout.addView(etAnc)
                  layout.addView(etTrans)
                  layout.addView(etOff)

                  // 4. أزرار التجربة الفورية للأكواد
                  val testRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 16, 0, 16)
                  }
                  val btnTestAnc = Button(this).apply {
                      text = "تجربة ANC"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          saveCurrentPrefs(spinner, pairedDevices, etService, etChar, etAnc, etTrans, etOff)
                          BudsWidgetProvider.dispatchDeviceCommand(this@MainActivity, etAnc.text.toString())
                          Toast.makeText(this@MainActivity, "تم إرسال أمر ANC للسماعة", Toast.LENGTH_SHORT).show()
                      }
                  }
                  val btnTestTrans = Button(this).apply {
                      text = "تجربة شفافية"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          saveCurrentPrefs(spinner, pairedDevices, etService, etChar, etAnc, etTrans, etOff)
                          BudsWidgetProvider.dispatchDeviceCommand(this@MainActivity, etTrans.text.toString())
                          Toast.makeText(this@MainActivity, "تم إرسال أمر الشفافية للسماعة", Toast.LENGTH_SHORT).show()
                      }
                  }
                  val btnTestOff = Button(this).apply {
                      text = "تجربة Off"
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                      setOnClickListener {
                          saveCurrentPrefs(spinner, pairedDevices, etService, etChar, etAnc, etTrans, etOff)
                          BudsWidgetProvider.dispatchDeviceCommand(this@MainActivity, etOff.text.toString())
                          Toast.makeText(this@MainActivity, "تم إرسال أمر Off للسماعة", Toast.LENGTH_SHORT).show()
                      }
                  }
                  testRow.addView(btnTestAnc)
                  testRow.addView(btnTestTrans)
                  testRow.addView(btnTestOff)
                  layout.addView(testRow)

                  val btnSave = Button(this).apply {
                      text = "💾 حفظ الإعدادات وتحديث الويدجيت"
                      setBackgroundColor(Color.parseColor("#1976D2"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          saveCurrentPrefs(spinner, pairedDevices, etService, etChar, etAnc, etTrans, etOff)
                          BudsWidgetProvider.updateAllWidgets(this@MainActivity)
                          Toast.makeText(this@MainActivity, "تم الحفظ وتحديث الويدجيت بنجاح!", Toast.LENGTH_SHORT).show()
                      }
                  }
                  layout.addView(btnSave)

                  root.addView(layout)
                  setContentView(root)
              }

              private fun updateDiscoveredSpinner(spinner: Spinner, list: List<DiscoveredChannel>, statusView: TextView) {
                  if (list.isEmpty()) {
                      statusView.text = "لم يتم العثور على قنوات مفتوحة (تأكد من إخراج السماعة من العلبة واتصالها)."
                  } else {
                      statusView.text = "✅ تم العثور على ${list.size} قناة تحكم! اختر منها للتجربة:"
                      spinner.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, list.map { it.label })
                  }
              }

              private fun saveCurrentPrefs(
                  spinner: Spinner,
                  pairedDevices: List<BluetoothDevice>,
                  etService: EditText,
                  etChar: EditText,
                  etAnc: EditText,
                  etTrans: EditText,
                  etOff: EditText
              ) {
                  val selectedIdx = spinner.selectedItemPosition
                  val mac = if (selectedIdx in pairedDevices.indices) pairedDevices[selectedIdx].address else "00:BB:43:31:46:A8"
                  getSharedPreferences("BudsPrefs", Context.MODE_PRIVATE).edit()
                      .putString("DEVICE_MAC", mac)
                      .putString("SERVICE_UUID", etService.text.toString().trim())
                      .putString("CHAR_UUID", etChar.text.toString().trim())
                      .putString("HEX_ANC", etAnc.text.toString().trim())
                      .putString("HEX_TRANS", etTrans.text.toString().trim())
                      .putString("HEX_OFF", etOff.text.toString().trim())
                      .apply()
              }

              private fun createInput(hintText: String, initialValue: String): EditText {
                  return EditText(this).apply {
                      hint = hintText
                      setText(initialValue)
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                      setPadding(20, 24, 20, 24)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  toneGen?.release()
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BudsController-Pro-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
